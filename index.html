<!DOCTYPE html>
<html>
<head>
    <title>Mera New Panel</title>
</head>
<body style="background-color: #1e1e2e; color: #fff; text-align: center; font-family: Arial; padding-top: 50px;">
    
    <div style="background-color: #2b2b3a; display: inline-block; padding: 30px; border-radius: 10px; border: 1px solid #444;">
        <h1 style="color: #4eed94;">Control Panel Active</h1>
        <p>Aapka naya web server kamyabi se chal raha hai.</p>
        
        <hr style="border: 0; border-top: 1px solid #555; margin: 20px 0;">
        
        <form>
            <input type="text" id="userName" placeholder="Apna Naam Likhein" style="padding: 10px; width: 200px; border-radius: 5px; border: none; margin-bottom: 10px;"><br>
            <button type="button" onclick="showAlert()" style="background-color: #4eed94; color: #111; font-weight: bold; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                Submit Fast
            </button>
        </form>
    </div>

    <script>
        function showAlert() {
            var name = document.getElementById("userName").value;
            if(name == "") {
                alert("Bhai, pehle apna naam toh likho!");
            } else {
                alert("Kamyabi Mil Gayi! Welcome, " + name + " Bhai!");
            }
        }
    </script>

</body>
</html>
